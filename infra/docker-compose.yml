
services:


  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      target: development
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    environment:
      WIEWARM_API_ORIGIN: http://apache-php:3770
      WIEWARM_ORIGIN: http://localhost:3770
      SESSION_SECRET: local-development-only-change-before-deploying
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 30

  ci-postgres:
    build:
      context: .
      dockerfile: Dockerfile.ci-postgres
    ports:
      - "127.0.0.1:3779:5432"
    volumes:
      - postgres-vol:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d devwiewarm"]
      interval: 5s
      timeout: 5s
      retries: 60
    environment:
      POSTGRES_DB: devwiewarm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Europe/Zurich
    command: postgres -c shared_buffers=2GB -c effective_cache_size=1GB -c maintenance_work_mem=128MB -c work_mem=16MB

  apache-php:
    build:
      context: .
      dockerfile: Dockerfile.apache-php
    ports:
      - "127.0.0.1:3770:3770"
    volumes:
      - ../www_public:/var/www/html
      - ./apache2.conf:/etc/apache2/apache2.conf
    environment:
      - TZ=Europe/Zurich
      - APACHE_PORT=3770
      - APACHE_BIND=0.0.0.0
      - FRONTEND_ORIGIN=http://frontend:3000
      - DB_TYPE=postgres
      - POSTGRES_HOST=ci-postgres
      - POSTGRES_DB=devwiewarm
      - POSTGRES_USER=webuser
      - POSTGRES_PASSWORD=badi
    depends_on:
      frontend:
        condition: service_healthy
      ci-postgres:
        condition: service_healthy

volumes:
  frontend-node-modules:
  frontend-next:
  postgres-vol:
