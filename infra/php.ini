; Application overrides layered on the upstream php.ini-production defaults.
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
include_path = ".:/var/www/html/api:/usr/local/lib/php:/usr/share/pear"

; Disable unused session upload progress (ordinary file uploads still work).
; Mitigates CVE-2026-115560 and the upload-progress paths of
; CVE-2026-109619 and CVE-2026-126714.
; https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx
; https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp
session.upload_progress.enabled = Off

; Disable the PHP 8.5 fatal-backtrace producer in CVE-2026-109619.
; https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
; These settings are partial mitigations, not a substitute for patched PHP.
; Rebuild the image and recreate containers to apply changes to all workers.
fatal_error_backtraces = Off
